name: Enviar mensajes del día

on:
  schedule:
    # GitHub Actions usa UTC: 02:00 UTC = 20:00 America/Mexico_City (del día anterior UTC).
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensajes programados
        run: |
          curl --fail-with-body --show-error --silent -X POST "${{ secrets.BACKEND_URL }}/internal/enviar-mensajes-del-dia" \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            --max-time 180 --retry 2 --retry-delay 30