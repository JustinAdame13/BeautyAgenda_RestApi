name: Reintentar mensajes fallidos

on:
  schedule:
    # GitHub Actions usa UTC: 03:00 UTC = 21:00 America/Mexico_City (del día anterior UTC).
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Reintentar mensajes fallidos
        run: |
          curl --fail-with-body --show-error --silent -X POST "${{ secrets.BACKEND_URL }}/internal/reintentar-fallidos" \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            --max-time 180 --retry 2 --retry-delay 30
