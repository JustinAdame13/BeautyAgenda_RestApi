spring.application.name=BeautyAgenda
server.port=${PORT:1313}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}


app.whatsapp.enabled= true
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_ID:}
app.whatsapp.api-version=v21.0

app.internal.api-key=${INTERNAL_API_KEY}